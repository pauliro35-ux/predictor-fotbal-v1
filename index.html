<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SHADOW HUNTER PRO | MASTERPIECE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Inter:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gold: #d4af37; --red: #ff003c; --bg: #000000; 
            --card: rgba(20, 20, 20, 0.8); --blue: #00f3ff; 
            --neon-glow: 0 0 15px rgba(255, 0, 60, 0.4);
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; 
            margin: 0; padding: 0; overflow-x: hidden;
            background-image: linear-gradient(rgba(0,0,0,0.9), rgba(0,0,0,0.9)), 
                              url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
        }

        .app-shell { width: 100%; max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; padding-bottom: 60px; }

        header { padding: 60px 20px 30px; text-align: center; }
        .logo { 
            font-family: 'Orbitron', sans-serif; font-size: 1.7rem; font-weight: 900; 
            letter-spacing: 12px; color: #fff; text-transform: uppercase; margin: 0;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }
        .status-badge { 
            font-size: 0.5rem; color: var(--gold); letter-spacing: 4px; 
            margin-top: 10px; font-weight: 800; text-transform: uppercase;
        }

        /* Control Panel Stilizat */
        .glass-panel { 
            margin: 0 20px; padding: 25px; background: var(--card);
            border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(20px); box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        
        .field-label { font-size: 0.6rem; color: #444; font-weight: 900; text-transform: uppercase; margin-bottom: 8px; display: block; }

        select { 
            width: 100%; height: 55px; background: #080808; color: #eee; 
            border: 1px solid #1a1a1a; border-radius: 14px; padding: 0 15px; 
            font-size: 0.85rem; margin-bottom: 15px; outline: none; appearance: none;
        }

        .btn-scan { 
            width: 100%; height: 60px; background: var(--red); color: #fff;
            border: none; border-radius: 14px; font-weight: 900; font-size: 0.9rem;
            text-transform: uppercase; cursor: pointer; letter-spacing: 2px;
            box-shadow: var(--neon-glow); transition: 0.3s;
        }
        .btn-scan:active { transform: scale(0.96); box-shadow: 0 0 5px var(--red); }

        /* Neural Progress Bar */
        .progress-container { display: none; margin: 20px; }
        .progress-bar { height: 2px; background: var(--blue); width: 0%; box-shadow: 0 0 10px var(--blue); border-radius: 10px; transition: width 0.3s; }

        /* Cards Feed */
        .feed { padding: 20px; }
        .node { 
            background: rgba(15, 15, 15, 0.6); border-radius: 22px; padding: 25px; 
            margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.03);
            animation: fadeIn 0.6s ease-out; position: relative;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .node-id { font-size: 0.55rem; color: #333; font-weight: 900; margin-bottom: 15px; display: block; }

        .match-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .team { font-size: 1.15rem; font-weight: 800; width: 42%; text-align: center; color: #fff; letter-spacing: -0.5px; }
        .vs-tag { font-family: 'Orbitron'; font-size: 0.6rem; color: var(--red); font-weight: 900; }

        .prediction-chip { 
            background: #000; padding: 18px; border-radius: 16px; 
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid rgba(0, 243, 255, 0.1);
        }
        .strategy { font-size: 0.75rem; color: var(--blue); font-weight: 800; text-transform: uppercase; }
        .odd { font-family: 'Orbitron'; color: var(--gold); font-weight: 900; font-size: 1.1rem; }

        footer { padding: 40px; text-align: center; font-size: 0.55rem; color: #222; letter-spacing: 2px; line-height: 2; }
    </style>
</head>
<body>

<div class="app-shell">
    <header>
        <h1 class="logo">SHADOW HUNTER</h1>
        <div class="status-badge" id="status-text">Global Uplink: Active</div>
    </header>

    <div class="glass-panel">
        <span class="field-label">Source Node</span>
        <select id="league-select">
            <option value="283">Superliga (Romania)</option>
            <option value="39">Premier League (England)</option>
            <option value="140">La Liga (Spain)</option>
            <option value="61">Ligue 1 (France)</option>
        </select>
        <button class="btn-scan" onclick="startDeepProcess()">Execute Deep Scan</button>
    </div>

    <div class="progress-container" id="p-container">
        <div class="progress-bar" id="p-bar"></div>
    </div>

    <div id="main-feed" class="feed"></div>

    <footer>
        SHADOW HUNTER PRO v15.5<br>
        SYSTEM STATUS: ENCRYPTED | CORE: 0x992<br>
        &copy; 2026 GLOBAL OMNIDATA TERMINAL
    </footer>
</div>

<script>
    const API_KEY = '622ae2fdcc0aa85aefa0cb9b05e0ecd8';

    async function startDeepProcess() {
        const leagueId = document.getElementById('league-select').value;
        const feed = document.getElementById('main-feed');
        const status = document.getElementById('status-text');
        const pContainer = document.getElementById('p-container');
        const pBar = document.getElementById('p-bar');

        feed.innerHTML = '';
        status.innerText = 'Analyzing Neural Patterns...';
        status.style.color = 'var(--blue)';
        pContainer.style.display = 'block';
        pBar.style.width = '30%';

        try {
            const response = await fetch(`https://v3.football.api-sports.io/fixtures?league=${leagueId}&next=10`, {
                headers: { "x-rapidapi-key": API_KEY, "x-rapidapi-host": "v3.football.api-sports.io" }
            });
            const data = await response.json();
            
            pBar.style.width = '100%';

            setTimeout(() => {
                pContainer.style.display = 'none';
                status.innerText = 'Deep Scan Complete';
                status.style.color = '#00ff00';
                
                if (data.response && data.response.length > 0) {
                    renderResults(data.response);
                } else {
                    feed.innerHTML = "<p style='text-align:center; color:#444; font-size:0.7rem; margin-top:20px;'>NO UPCOMING DATA FOR THIS NODE.</p>";
                }
            }, 600);

        } catch (e) {
            status.innerText = 'Connection Interrupted';
            status.style.color = 'var(--red)';
        }
    }

    function renderResults(matches) {
        const feed = document.getElementById('main-feed');
        feed.innerHTML = matches.map(m => `
            <div class="node">
                <span class="node-id">DATA_STREAM_#${m.fixture.id}</span>
                <div class="match-row">
                    <div class="team">${m.teams.home.name.toUpperCase()}</div>
                    <div class="vs-tag">VS</div>
                    <div class="team">${m.teams.away.name.toUpperCase()}</div>
                </div>
                <div class="prediction-chip">
                    <span class="strategy">${getStrategy()}</span>
                    <span class="odd">@${(1.3 + Math.random() * 1.5).toFixed(2)}</span>
                </div>
            </div>
        `).join('');
    }

    function getStrategy() {
        const s = ["Home DNB", "Over 2.5", "BTTS - Yes", "Under 3.5", "Asian Handicap -1"];
        return s[Math.floor(Math.random() * s.length)];
    }
</script>
</body>
</html>
