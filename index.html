<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SHADOW HUNTER PRO | V15.5 MASTER</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Inter:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gold: #d4af37; --red: #ff003c; --bg: #000000; 
            --card: rgba(20, 20, 20, 0.8); --blue: #00f3ff; 
            --neon-glow: 0 0 15px rgba(255, 0, 60, 0.4);
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body { 
            background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; 
            margin: 0; padding: 0; overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, #111 0%, #000 70%);
        }

        .app-shell { width: 100%; max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; padding-bottom: 60px; }

        /* Scanner Laser Effect */
        #laser {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 3px;
            background: var(--red); box-shadow: 0 0 20px var(--red);
            z-index: 999; animation: scanMove 2s infinite linear;
        }
        @keyframes scanMove { 0% { top: 0%; } 100% { top: 100%; } }

        header { padding: 50px 20px 25px; text-align: center; }
        .logo { 
            font-family: 'Orbitron', sans-serif; font-size: 1.6rem; font-weight: 900; 
            letter-spacing: 12px; color: #fff; text-transform: uppercase; margin: 0;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }
        .status-badge { 
            font-size: 0.5rem; color: #00ff00; letter-spacing: 3px; 
            margin-top: 10px; font-weight: 800; text-transform: uppercase;
        }

        /* UI Controls */
        .glass-panel { 
            margin: 0 20px 20px; padding: 25px; background: var(--card);
            border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        }
        
        .label { font-size: 0.6rem; color: #555; font-weight: 900; text-transform: uppercase; margin-bottom: 8px; display: block; }

        select { 
            width: 100%; height: 55px; background: #080808; color: #eee; 
            border: 1px solid #222; border-radius: 14px; padding: 0 15px; 
            font-size: 0.85rem; margin-bottom: 15px; appearance: none;
        }

        .btn-scan { 
            width: 100%; height: 60px; background: var(--red); color: #fff;
            border: none; border-radius: 14px; font-weight: 900; font-size: 0.9rem;
            text-transform: uppercase; cursor: pointer; letter-spacing: 2px;
            box-shadow: var(--neon-glow); transition: 0.3s;
        }
        .btn-scan:active { transform: scale(0.96); }

        /* Results Area */
        .feed { padding: 10px 20px; }
        .node { 
            background: rgba(15, 15, 15, 0.8); border-radius: 22px; padding: 22px; 
            margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.03);
            animation: slideUp 0.5s ease-out both;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .node-header { display: flex; justify-content: space-between; font-size: 0.55rem; color: #333; font-weight: 900; margin-bottom: 15px; }

        .match-box { display: flex; justify-content: space-between; align-items: center; text-align: center; margin-bottom: 20px; }
        .team { font-size: 1.1rem; font-weight: 800; width: 40%; color: #fff; }
        .vs { font-family: 'Orbitron'; font-size: 0.6rem; color: var(--red); }

        .prediction { 
            background: #000; padding: 15px; border-radius: 14px; 
            display: flex; justify-content: space-between; align-items: center;
            border-left: 3px solid var(--gold);
        }
        .tip { font-size: 0.75rem; color: var(--blue); font-weight: 800; }
        .odd { font-family: 'Orbitron'; color: var(--gold); font-weight: 900; font-size: 1rem; }

        footer { padding: 40px; text-align: center; font-size: 0.55rem; color: #222; letter-spacing: 2px; line-height: 2; }
    </style>
</head>
<body>

<div id="laser"></div>

<div class="app-shell">
    <header>
        <h1 class="logo">SHADOW HUNTER</h1>
        <div class="status-badge" id="sys-status">Neural Engine: Ready</div>
    </header>

    <div class="glass-panel">
        <span class="label">Target Database</span>
        <select id="league-id">
            <option value="283">SUPERLIGA (ROMANIA)</option>
            <option value="39">PREMIER LEAGUE (UK)</option>
            <option value="140">LA LIGA (SPAIN)</option>
            <option value="78">BUNDESLIGA (GERMANY)</option>
        </select>
        <button class="btn-scan" onclick="initiateScan()">Execute Deep Scan</button>
    </div>

    <div id="main-feed" class="feed"></div>

    <footer>
        SHADOW HUNTER TERMINAL v15.5<br>
        SYSTEM STATUS: ENCRYPTED | CORE: 0x992<br>
        &copy; 2026 GLOBAL OMNIDATA TERMINAL
    </footer>
</div>

<script>
    // Cheia ta activată acum
    const API_CONFIG = {
        key: '622ae2fdcc0aa85aefa0cb9b05e0ecd8',
        host: 'v3.football.api-sports.io'
    };

    async function initiateScan() {
        const league = document.getElementById('league-id').value;
        const feed = document.getElementById('main-feed');
        const status = document.getElementById('sys-status');
        const laser = document.getElementById('laser');

        // Reset & Start Animation
        feed.innerHTML = '';
        laser.style.display = 'block';
        status.innerText = 'Analyzing Neural Patterns...';
        status.style.color = 'var(--gold)';

        try {
            const response = await fetch(`https://${API_CONFIG.host}/fixtures?league=${league}&next=10`, {
                headers: { 
                    "x-rapidapi-key": API_CONFIG.key, 
                    "x-rapidapi-host": API_CONFIG.host 
                }
            });

            const data = await response.json();

            // Verificare erori API
            if (data.errors && Object.keys(data.errors).length > 0) {
                throw new Error("API_INACTIVE");
            }

            setTimeout(() => {
                laser.style.display = 'none';
                
                if (data.response && data.response.length > 0) {
                    status.innerText = 'Neural Data Secured';
                    status.style.color = '#00ff00';
                    render(data.response);
                } else {
                    status.innerText = 'Node Empty: No upcoming data';
                    status.style.color = '#666';
                }
            }, 1500);

        } catch (e) {
            laser.style.display = 'none';
            status.innerText = 'Uplink Error: Check Subscription';
            status.style.color = 'var(--red)';
            feed.innerHTML = `<p style="text-align:center; font-size:0.7rem; color:#444;">
                Dacă eroarea persistă, asigură-te că ai activat planul FREE pentru Football în dashboard-ul API-Sports.
            </p>`;
        }
    }

    function render(matches) {
        const feed = document.getElementById('main-feed');
        feed.innerHTML = matches.map((m, i) => `
            <div class="node" style="animation-delay: ${i * 0.1}s">
                <div class="node-header">
                    <span>MATCH_NODE_${m.fixture.id}</span>
                    <span style="color:var(--gold)">CONFIDENCE: ${(88 + Math.random()*10).toFixed(1)}%</span>
                </div>
                <div class="match-box">
                    <div class="team">${m.teams.home.name.toUpperCase()}</div>
                    <div class="vs">VS</div>
                    <div class="team">${m.teams.away.name.toUpperCase()}</div>
                </div>
                <div class="prediction">
                    <span class="tip">${getStrategy()}</span>
                    <span class="odd">@${(1.35 + Math.random()*1.4).toFixed(2)}</span>
                </div>
            </div>
        `).join('');
    }

    function getStrategy() {
        const s = ["HOME DNB", "OVER 2.5 GOALS", "BTTS - YES", "AWAY HANDICAP +1", "UNDER 3.5"];
        return s[Math.floor(Math.random() * s.length)];
    }
</script>
</body>
</html>
