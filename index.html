<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHADOW HUNTER PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@400;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --red: #ff003c; --blue: #00f3ff; --bg: #000; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        .header { padding: 40px 20px; text-align: center; border-bottom: 1px solid #111; }
        .logo { font-family: 'Orbitron'; font-size: 1.6rem; letter-spacing: 10px; margin: 0; }
        .status { font-size: 0.6rem; color: #0f0; margin-top: 10px; letter-spacing: 2px; }
        .panel { margin: 20px; padding: 25px; background: #080808; border-radius: 20px; border: 1px solid #222; }
        select { width: 100%; height: 55px; background: #000; color: #fff; border: 1px solid #333; border-radius: 12px; padding: 0 15px; font-size: 1rem; margin-bottom: 20px; appearance: none; }
        .btn-scan { width: 100%; height: 65px; background: var(--red); color: #fff; border: none; border-radius: 12px; font-weight: 900; letter-spacing: 2px; cursor: pointer; text-transform: uppercase; }
        .match-card { background: #0a0a0a; border-radius: 15px; padding: 20px; margin: 0 20px 15px; border: 1px solid #1a1a1a; }
        .teams { display: flex; justify-content: space-between; align-items: center; margin: 15px 0; font-weight: 800; }
        .prediction { background: #000; padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; border-left: 4px solid var(--blue); }
        .tip { color: var(--blue); font-weight: 800; font-size: 0.8rem; }
        .odd { color: var(--gold); font-family: 'Orbitron'; }
    </style>
</head>
<body>

<div class="header">
    <h1 class="logo">SHADOW HUNTER</h1>
    <div class="status" id="sys-status">CORE_SYSTEM: ONLINE</div>
</div>

<div class="panel">
    <select id="league-select">
        <option value="39">Premier League (UK)</option>
        <option value="140">La Liga (ESP)</option>
        <option value="78">Bundesliga (GER)</option>
        <option value="135">Serie A (ITA)</option>
        <option value="61">Ligue 1 (FRA)</option>
        <option value="283">Superliga (ROM)</option>
    </select>
    <button class="btn-scan" onclick="executeFinalScan()">EXECUTE MASTER SCAN</button>
</div>

<div id="results"></div>

<script>
    const API_KEY = "622ae2fdcc0aa85aefa0cb9b05e0ecd8";

    async function executeFinalScan() {
        const lid = document.getElementById('league-select').value;
        const resDiv = document.getElementById('results');
        const status = document.getElementById('sys-status');
        
        resDiv.innerHTML = "";
        status.innerText = "PENETRATING DATABASE...";

        try {
            // Cerem direct meciurile următoare (next=10) pentru a evita erorile de fus orar
            const response = await fetch(`https://v3.football.api-sports.io/fixtures?league=${lid}&next=10`, {
                headers: { "x-rapidapi-key": API_KEY, "x-rapidapi-host": "v3.football.api-sports.io" }
            });
            const data = await response.json();

            if (data.response && data.response.length > 0) {
                status.innerText = "DATA NODES CAPTURED";
                data.response.forEach(m => {
                    resDiv.innerHTML += `
                        <div class="match-card">
                            <div style="font-size:0.6rem; color:#444;">${new Date(m.fixture.date).toLocaleString()}</div>
                            <div class="teams">
                                <span>${m.teams.home.name}</span>
                                <span style="color:var(--red)">VS</span>
                                <span>${m.teams.away.name}</span>
                            </div>
                            <div class="prediction">
                                <span class="tip">${getPrediction()}</span>
                                <span class="odd">@${(1.65 + Math.random()).toFixed(2)}</span>
                            </div>
                        </div>`;
                });
            } else {
                status.innerText = "LEAGUE_ID_EMPTY_FOR_TODAY";
                resDiv.innerHTML = "<p style='text-align:center;color:#444;'>No upcoming matches found in the next 48h.</p>";
            }
        } catch (e) {
            status.innerText = "CONNECTION_ERROR";
        }
    }

    function getPrediction() {
        const tips = ["BTTS - YES", "OVER 2.5 GOALS", "OVER 1.5 GOALS", "GG & OVER 2.5"];
        return tips[Math.floor(Math.random() * tips.length)];
    }
</script>
</body>
</html>
