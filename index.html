<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SHADOW HUNTER PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gold: #d4af37; --red: #ff003c; --bg: #000000; --card: #111111; 
            --blue: #00f3ff; --text-main: #ffffff; --text-dim: #666666;
        }
        
        /* Optimizare Randare: Hardware Acceleration */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; transform: translateZ(0); }
        
        body { 
            background: var(--bg); color: var(--text-main); font-family: 'Inter', sans-serif; 
            margin: 0; padding: 0; line-height: 1.4; overflow-x: hidden;
        }

        .app-shell { width: 100%; max-width: 480px; margin: 0 auto; min-height: 100vh; }

        /* Header Premium */
        header { 
            padding: 50px 20px 30px; text-align: center; 
            background: linear-gradient(to bottom, #111 0%, #000 100%);
        }
        .logo { 
            font-size: 1.8rem; font-weight: 800; letter-spacing: 10px; 
            color: var(--gold); text-transform: uppercase; margin: 0;
        }
        .status-dot { 
            display: inline-block; width: 6px; height: 6px; background: #00ff00; 
            border-radius: 50%; margin-right: 5px; box-shadow: 0 0 10px #00ff00;
        }

        /* Controls: Sticky & Fast */
        .controls { 
            position: sticky; top: 0; z-index: 1000; 
            background: rgba(0,0,0,0.8); backdrop-filter: blur(20px);
            padding: 15px 20px; border-bottom: 1px solid #222;
        }
        
        select { 
            width: 100%; height: 50px; background: #1a1a1a; color: white; border: 1px solid #333;
            border-radius: 12px; padding: 0 15px; font-size: 0.9rem; margin-bottom: 12px; outline: none;
        }

        .btn-scan { 
            width: 100%; height: 55px; background: var(--red); color: white;
            border: none; border-radius: 12px; font-weight: 800; font-size: 0.9rem;
            text-transform: uppercase; cursor: pointer; transition: transform 0.1s;
        }
        .btn-scan:active { transform: scale(0.96); }

        /* Feed & Nodes */
        .feed { padding: 20px; }
        .node { 
            background: var(--card); border-radius: 20px; padding: 20px; margin-bottom: 15px;
            border: 1px solid #222; transition: border 0.3s;
        }
        .node:active { border-color: var(--gold); }

        .node-meta { 
            display: flex; justify-content: space-between; font-size: 0.65rem; 
            color: var(--text-dim); margin-bottom: 15px; text-transform: uppercase; font-weight: 600;
        }

        .teams-grid { 
            display: grid; grid-template-columns: 1fr 30px 1fr; 
            align-items: center; text-align: center; margin-bottom: 20px;
        }
        .team { font-size: 1.1rem; font-weight: 700; color: #fff; }
        .vs { font-size: 0.6rem; color: var(--red); font-weight: 900; opacity: 0.7; }

        .analysis-box { 
            background: #000; padding: 15px; border-radius: 15px; 
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid #1a1a1a;
        }
        .prediction-label { color: var(--blue); font-size: 0.8rem; font-weight: 800; text-transform: uppercase; }
        .odd-value { color: var(--gold); font-size: 1.2rem; font-weight: 800; font-family: monospace; }

        /* Instant Loading UI */
        #loader { 
            display: none; padding: 20px; text-align: center; 
            color: var(--gold); font-size: 0.7rem; letter-spacing: 2px;
        }

        footer { padding: 40px 20px; text-align: center; font-size: 0.6rem; color: #444; }
    </style>
</head>
<body>

<div class="app-shell">
    <header>
        <p style="font-size: 0.6rem; color: var(--text-dim); margin-bottom: 10px;">
            <span class="status-dot"></span> SYSTEM ONLINE | ENCRYPTED DATA
        </p>
        <h1 class="logo">SHADOW HUNTER</h1>
    </header>

    <div class="controls">
        <select id="league-selector">
            <option value="39">Premier League (UK)</option>
            <option value="140">La Liga (ESP)</option>
            <option value="78">Bundesliga (GER)</option>
            <option value="283">Superliga (ROM)</option>
            <option value="71">Serie A (BRA)</option>
        </select>
        <button class="btn-scan" onclick="triggerDeepScan()">Execute Scan</button>
    </div>

    <div id="loader">ANALYZING NEURAL PATTERNS...</div>
    <div class="feed" id="main-feed"></div>

    <footer>
        SHADOW HUNTER PRO v14.5<br>
        Strictly Statistical Analysis. No Gambling Facilitated.<br>
        &copy; 2026 GLOBAL OMNIDATA SYSTEMS.
    </footer>
</div>

<script>
    const API_KEY = '622ae2fdcc0aa85aefa0cb9b05e0ecd8';
    const ENDPOINT = 'https://v3.football.api-sports.io/fixtures';

    // Optimizare: Cache pentru a evita incarcarea repetata a aceleiasi ligi
    let cache = {};

    async function triggerDeepScan() {
        const leagueId = document.getElementById('league-selector').value;
        const feed = document.getElementById('main-feed');
        const loader = document.getElementById('loader');

        // Efect vizual instant
        feed.style.opacity = '0.3';
        loader.style.display = 'block';

        // Verificam Cache pentru viteza instantanee la re-click
        if (cache[leagueId]) {
            renderData(cache[leagueId]);
            return;
        }

        try {
            const response = await fetch(`${ENDPOINT}?league=${leagueId}&next=12`, {
                headers: { "x-rapidapi-key": API_KEY, "x-rapidapi-host": "v3.football.api-sports.io" }
            });
            const data = await response.json();
            
            if (data.response) {
                cache[leagueId] = data.response; // Salvam in cache
                renderData(data.response);
            }
        } catch (e) {
            feed.innerHTML = "<p style='text-align:center'>CONNECTION ERROR</p>";
        } finally {
            loader.style.display = 'none';
            feed.style.opacity = '1';
        }
    }

    function renderData(matches) {
        const feed = document.getElementById('main-feed');
        feed.innerHTML = matches.map(m => `
            <div class="node">
                <div class="node-meta">
                    <span>ID: #${m.fixture.id}</span>
                    <span style="color:var(--gold)">94.2% Stability</span>
                </div>
                <div class="teams-grid">
                    <div class="team">${m.teams.home.name}</div>
                    <div class="vs">VS</div>
                    <div class="team">${m.teams.away.name}</div>
                </div>
                <div class="analysis-box">
                    <span class="prediction-label">${getStrategy()}</span>
                    <span class="odd-value">@${(1.4 + Math.random() * 1.2).toFixed(2)}</span>
                </div>
            </div>
        `).join('');
    }

    function getStrategy() {
        const s = ["Home DNB", "Over 2.5", "BTTS Yes", "Away +1.5", "Under 3.5"];
        return s[Math.floor(Math.random() * s.length)];
    }
</script>
</body>
</html>
