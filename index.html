<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHADOW HUNTER FINAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@400;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --red: #ff003c; --blue: #00f3ff; --bg: #000; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; }
        .header { padding: 40px 20px; text-align: center; border-bottom: 1px solid #111; }
        .logo { font-family: 'Orbitron'; font-size: 1.5rem; letter-spacing: 8px; }
        .panel { margin: 20px; padding: 25px; background: #080808; border-radius: 20px; border: 1px solid #222; }
        select { width: 100%; height: 55px; background: #000; color: #fff; border: 1px solid #333; border-radius: 12px; font-size: 1rem; margin-bottom: 20px; appearance: none; padding: 0 10px; }
        .btn-scan { width: 100%; height: 65px; background: var(--red); color: #fff; border: none; border-radius: 12px; font-weight: 900; text-transform: uppercase; cursor: pointer; box-shadow: 0 0 20px rgba(255,0,62,0.4); }
        #results { padding: 0 20px 100px; }
        .match-card { background: #0a0a0a; border-radius: 15px; padding: 20px; margin-bottom: 15px; border: 1px solid #1a1a1a; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .teams { display: flex; justify-content: space-between; align-items: center; margin: 15px 0; font-weight: 800; font-size: 1rem; }
        .prediction { background: #000; padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; border-left: 4px solid var(--blue); }
        .tip { color: var(--blue); font-weight: 800; font-size: 0.8rem; text-transform: uppercase; }
        .odd { color: var(--gold); font-family: 'Orbitron'; font-weight: 900; }
    </style>
</head>
<body>
    <div class="header">
        <h1 class="logo">SHADOW HUNTER</h1>
        <div id="sys-status" style="font-size:0.5rem; color:#0f0; margin-top:10px; letter-spacing:2px;">CORE_V15_READY</div>
    </div>
    <div class="panel">
        <select id="league-select">
            <option value="39">Premier League (UK)</option>
            <option value="140">La Liga (ESP)</option>
            <option value="78">Bundesliga (GER)</option>
            <option value="135">Serie A (ITA)</option>
            <option value="61">Ligue 1 (FRA)</option>
            <option value="283">Superliga (ROM)</option>
        </select>
        <button class="btn-scan" onclick="scan()">EXECUTE MASTER SCAN</button>
    </div>
    <div id="results"></div>

    <script>
        const API_KEY = "622ae2fdcc0aa85aefa0cb9b05e0ecd8";
        
        async function scan() {
            const lid = document.getElementById('league-select').value;
            const res = document.getElementById('results');
            const status = document.getElementById('sys-status');
            
            res.innerHTML = "<p style='text-align:center; color:var(--gold)'>PENETRATING DATABASE...</p>";
            
            try {
                // Forțăm direct următoarele 15 meciuri indiferent de oră
                const response = await fetch(`https://v3.football.api-sports.io/fixtures?league=${lid}&next=15`, {
                    headers: { "x-rapidapi-key": API_KEY, "x-rapidapi-host": "v3.football.api-sports.io" }
                });
                const data = await response.json();
                
                res.innerHTML = "";
                
                if (data.response && data.response.length > 0) {
                    status.innerText = "DATA_NODES_FOUND: " + data.response.length;
                    data.response.forEach(m => {
                        res.innerHTML += `
                            <div class="match-card">
                                <div style="font-size:0.55rem; color:#444; margin-bottom:10px;">
                                    ${new Date(m.fixture.date).toLocaleString([], {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'})}
                                </div>
                                <div class="teams">
                                    <span style="width:40%; text-align:center">${m.teams.home.name}</span>
                                    <span style="color:var(--red); font-size:0.7rem">VS</span>
                                    <span style="width:40%; text-align:center">${m.teams.away.name}</span>
                                </div>
                                <div class="prediction">
                                    <span class="tip">${getTip()}</span>
                                    <span class="odd">@${(1.55 + Math.random() * 0.8).toFixed(2)}</span>
                                </div>
                            </div>`;
                    });
                } else {
                    status.innerText = "ERROR: NO_DATA_STREAM";
                    res.innerHTML = "<p style='text-align:center; color:#555'>No upcoming games found for this ID.</p>";
                }
            } catch (e) {
                res.innerHTML = "<p style='text-align:center; color:red'>CONNECTION_FAILED</p>";
            }
        }

        function getTip() {
            const tips = ["BTTS - YES", "OVER 2.5 GOALS", "OVER 1.5 GOALS", "GG & OVER 2.5"];
            return tips[Math.floor(Math.random() * tips.length)];
        }
    </script>
</body>
</html>
