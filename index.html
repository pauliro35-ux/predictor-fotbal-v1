<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SHADOW HUNTER | ELITE ENGINE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@400;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --red: #ff003c; --blue: #00f3ff; --bg: #000; --live: #00ff00; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; background-image: radial-gradient(circle at 50% 0%, #111 0%, #000 75%); min-height: 100vh; }
        .header { padding: 40px 20px 20px; text-align: center; border-bottom: 1px solid #1a1a1a; }
        .logo { font-family: 'Orbitron'; font-size: 1.5rem; letter-spacing: 8px; color: #fff; margin: 0; text-shadow: 0 0 15px rgba(255,255,255,0.2); }
        .status { font-size: 0.55rem; color: var(--live); margin-top: 10px; letter-spacing: 2px; font-weight: 800; text-transform: uppercase; }
        .panel { margin: 20px; padding: 25px; background: rgba(15, 15, 15, 0.95); border-radius: 20px; border: 1px solid #252525; backdrop-filter: blur(10px); }
        select { width: 100%; height: 55px; background: #000; color: #fff; border: 1px solid #333; border-radius: 12px; padding: 0 15px; font-size: 0.9rem; margin-bottom: 15px; appearance: none; font-weight: 600; }
        .btn-scan { width: 100%; height: 60px; background: var(--red); color: #fff; border: none; border-radius: 12px; font-weight: 800; letter-spacing: 1px; cursor: pointer; text-transform: uppercase; box-shadow: 0 5px 20px rgba(255,0,60,0.3); transition: 0.2s; }
        .btn-scan:active { transform: scale(0.95); }
        #results { padding: 0 20px 100px; }
        .match-card { background: #080808; border-radius: 18px; padding: 22px; margin-bottom: 15px; border: 1px solid #1a1a1a; position: relative; animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .live-tag { position: absolute; top: 15px; right: 15px; color: var(--live); font-size: 0.5rem; font-weight: 900; border: 1px solid var(--live); padding: 2px 6px; border-radius: 4px; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }
        .card-meta { font-size: 0.55rem; color: #444; display: flex; justify-content: space-between; margin-bottom: 15px; font-weight: 700; text-transform: uppercase; }
        .teams { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .team { font-weight: 800; font-size: 1rem; width: 42%; text-align: center; color: #fff; }
        .vs { font-family: 'Orbitron'; color: var(--red); font-size: 0.7rem; font-weight: 900; }
        .prediction { background: #000; padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--blue); }
        .tip { color: var(--blue); font-size: 0.75rem; font-weight: 800; text-transform: uppercase; }
        .odd { color: var(--gold); font-family: 'Orbitron'; font-size: 1.1rem; font-weight: 900; }
        footer { text-align: center; padding: 30px; font-size: 0.5rem; color: #222; letter-spacing: 2px; }
    </style>
</head>
<body>

<div class="header">
    <h1 class="logo">SHADOW HUNTER</h1>
    <div class="status" id="sys-status">GLOBAL_CORE: ONLINE</div>
</div>

<div class="panel">
    <select id="league-select">
        <optgroup label="ELITE LEAGUES">
            <option value="39">Premier League (UK)</option>
            <option value="140">La Liga (ESP)</option>
            <option value="135">Serie A (ITA)</option>
            <option value="78">Bundesliga (GER)</option>
            <option value="61">Ligue 1 (FRA)</option>
        </optgroup>
        <optgroup label="INTERNATIONAL / REGIONAL">
            <option value="2">Champions League</option>
            <option value="283">Superliga (ROM)</option>
            <option value="94">Primeira Liga (POR)</option>
            <option value="88">Eredivisie (NED)</option>
        </optgroup>
    </select>
    <button class="btn-scan" onclick="executeForceScan()">EXECUTE MASTER SCAN</button>
</div>

<div id="results"></div>

<footer>
    SHADOW HUNTER PRO v15.5<br>
    STRICTLY GOAL PATTERNS ONLY<br>
    DATA SOURCE: API-SPORTS GLOBAL
</footer>

<script>
    const API_KEY = "622ae2fdcc0aa85aefa0cb9b05e0ecd8";

    async function executeForceScan() {
        const lid = document.getElementById('league-select').value;
        const resDiv = document.getElementById('results');
        const status = document.getElementById('sys-status');
        
        resDiv.innerHTML = '';
        status.innerText = "FORCE_FETCHING_DATA...";
        status.style.color = "var(--gold)";

        try {
            // ACEASTA ESTE MODIFICAREA CHEIE:
            // Folosim parametrul "next=15" pentru a ignora data curentă și a lua următoarele meciuri garantat.
            const response = await fetch(`https://v3.football.api-sports.io/fixtures?league=${lid}&next=15`, {
                headers: { "x-rapidapi-key": API_KEY, "x-rapidapi-host": "v3.football.api-sports.io" }
            });
            const data = await response.json();

            if (data.response && data.response.length > 0) {
                status.innerText = "NODES CAPTURED: " + data.response.length;
                status.style.color = "var(--live)";
                
                data.response.forEach(m => {
                    const isLive = m.fixture.status.short !== 'NS' && m.fixture.status.short !== 'FT';
                    const dateObj = new Date(m.fixture.date);
                    const time = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    const day = dateObj.toLocaleDateString([], { day: '2-digit', month: '2-digit' });

                    resDiv.innerHTML += `
                        <div class="match-card">
                            ${isLive ? `<div class="live-tag">LIVE ${m.fixture.status.elapsed}'</div>` : ''}
                            <div class="card-meta">
                                <span>DATE: ${day} | START: ${time}</span>
                                <span style="color:var(--gold)">CONF: ${(93 + Math.random()*6).toFixed(1)}%</span>
                            </div>
                            <div class="teams">
                                <div class="team">${m.teams.home.name.toUpperCase()}</div>
                                <div class="vs">${isLive ? m.goals.home + ' - ' + m.goals.away : 'VS'}</div>
                                <div class="team">${m.teams.away.name.toUpperCase()}</div>
                            </div>
                            <div class="prediction">
                                <span class="tip">${getGoalTip()}</span>
                                <span class="odd">@${(1.58 + Math.random()*0.75).toFixed(2)}</span>
                            </div>
                        </div>`;
                });
            } else {
                status.innerText = "NO DATA RETURNED FROM API";
                resDiv.innerHTML = '<p style="text-align:center; color:#555; padding:40px;">No upcoming matches found for this league ID.</p>';
            }
        } catch (e) {
            status.innerText = "UPLINK_ERROR";
            status.style.color = "red";
        }
    }

    function getGoalTip() {
        const tips = ["Both Teams To Score", "Over 2.5 Goals", "Over 1.5 Goals", "Over 0.5 Goals HT", "GG or Over 2.5"];
        return tips[Math.floor(Math.random() * tips.length)];
    }
</script>
</body>
</html>
