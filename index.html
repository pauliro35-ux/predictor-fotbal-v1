<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHADOW HUNTER | BLACK HORIZON V8.0</title>
    <style>
        :root { 
            --neon-red: #ff003c; 
            --neon-green: #00f3ff; 
            --dark-bg: #030303;
            --glass: rgba(255, 255, 255, 0.03);
            --accent: #1a1a1a;
        }

        body { 
            background: var(--dark-bg); 
            color: #e0e0e0; 
            font-family: 'Inter', 'Segoe UI', sans-serif; 
            margin: 0; 
            display: flex; 
            justify-content: center;
            overflow-x: hidden;
        }

        /* Scanline Effect */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 9999;
            pointer-events: none;
            background-size: 100% 2px, 3px 100%;
        }

        .container {
            width: 100%;
            max-width: 550px;
            padding: 20px;
            min-height: 100vh;
            background: radial-gradient(circle at top, #111 0%, #030303 100%);
        }

        .main-header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 1px solid var(--accent);
            margin-bottom: 30px;
        }

        .main-header h1 {
            font-size: 2.2rem;
            letter-spacing: 8px;
            margin: 0;
            background: linear-gradient(to right, #fff, var(--neon-red));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            color: var(--neon-green);
            text-transform: uppercase;
            margin-top: 10px;
            font-family: monospace;
        }

        .control-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .shadow-input, select {
            background: var(--accent);
            border: 1px solid #333;
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .shadow-input:focus { border-color: var(--neon-red); outline: none; box-shadow: 0 0 15px rgba(255, 0, 60, 0.2); }

        .btn-core {
            grid-column: span 2;
            background: var(--neon-red);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 8px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 0, 60, 0.3);
        }

        .btn-core:active { transform: scale(0.98); }

        /* Match Cards Advanced */
        .match-node {
            background: var(--glass);
            border: 1px solid #222;
            border-radius: 12px;
            margin-bottom: 15px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .match-node:hover { border-color: var(--neon-green); background: rgba(0, 243, 255, 0.02); }

        .prob-bar {
            height: 4px;
            background: #111;
            width: 100%;
            margin-top: 15px;
            border-radius: 2px;
            overflow: hidden;
        }

        .prob-fill {
            height: 100%;
            background: var(--neon-green);
            transition: width 1s ease-out;
        }

        .neural-processing {
            display: none;
            text-align: center;
            padding: 20px;
            font-family: monospace;
            color: var(--neon-green);
        }

        .badge-strategy {
            font-size: 0.6rem;
            padding: 2px 6px;
            border: 1px solid;
            border-radius: 4px;
            float: right;
        }

        @keyframes pulse { 0% { opacity: 0.4; } 100% { opacity: 1; } }
        .analyzing { animation: pulse 0.5s infinite alternate; }
    </style>
</head>
<body>

<div class="container">
    <div class="main-header">
        <h1>SHADOW HUNTER</h1>
        <div class="status-bar">
            <span>Core: Active</span>
            <span id="timestamp"></span>
            <span>Latency: 14ms</span>
        </div>
    </div>

    <div class="control-grid">
        <select id="liga" class="shadow-input" style="grid-column: span 2;">
            <option value="PL">Premier League (ENG)</option>
            <option value="PD">La Liga (ESP)</option>
            <option value="BL1">Bundesliga (GER)</option>
            <option value="SA">Serie A (ITA)</option>
            <option value="CL">Champions League</option>
        </select>
        
        <select id="risk-profile" class="shadow-input">
            <option value="safe">Profile: Conservative</option>
            <option value="balanced" selected>Profile: Balanced</option>
            <option value="aggressive">Profile: High Risk</option>
        </select>

        <button class="btn-core" onclick="initNeuralSearch()">Execute Neural Scan</button>
    </div>

    <div id="loader" class="neural-processing">
        [ <span class="analyzing">DECRYPTING DATA STREAMS...</span> ]
    </div>

    <div id="results-engine"></div>

    <div class="status-bar" style="margin-top: 50px; opacity: 0.3;">
        <span>V8.0 "BLACK HORIZON"</span>
        <span>NO REFUNDS</span>
    </div>
</div>

<script>
    const API_KEY = '4eb3f34ff8c24bdb93897d45b951126d'; // Folosind cheia ta
    
    // Update Clock
    setInterval(() => {
        document.getElementById('timestamp').innerText = new Date().toLocaleTimeString();
    }, 1000);

    async function initNeuralSearch() {
        const engine = document.getElementById('results-engine');
        const loader = document.getElementById('loader');
        const league = document.getElementById('liga').value;
        const risk = document.getElementById('risk-profile').value;

        engine.innerHTML = '';
        loader.style.display = 'block';

        try {
            const proxy = "https://corsproxy.io/?";
            const url = `https://api.football-data.org/v4/competitions/${league}/matches?status=SCHEDULED`;
            const response = await fetch(proxy + encodeURIComponent(url), { 
                headers: { 'X-Auth-Token': API_KEY } 
            });
            const data = await response.json();
            
            loader.style.display = 'none';
            
            if(!data.matches || data.matches.length === 0) {
                engine.innerHTML = '<div style="text-align:center">NO ACTIVE NODES FOUND</div>';
                return;
            }

            data.matches.slice(0, 10).forEach((m, index) => {
                setTimeout(() => {
                    renderComplexNode(m, risk);
                }, index * 150); // Efect de cascadă
            });

        } catch (e) {
            loader.innerHTML = '<span style="color:red">UPLINK FAILED: CHECK API QUOTA</span>';
        }
    }

    function renderComplexNode(match, risk) {
        const engine = document.getElementById('results-engine');
        const analysis = simulateDeepAnalysis(match.homeTeam.name, match.awayTeam.name, risk);
        
        const card = document.createElement('div');
        card.className = 'match-node';
        card.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center">
                <span style="font-size:0.7rem; color:#666;">EVENT_ID: ${match.id}</span>
                <span class="badge-strategy" style="color:${analysis.color}; border-color:${analysis.color}">
                    ${risk.toUpperCase()}
                </span>
            </div>
            
            <div style="display:grid; grid-template-columns: 1fr 40px 1fr; align-items:center; margin-top:15px; text-align:center;">
                <div style="font-weight:bold">${match.homeTeam.shortName || match.homeTeam.name}</div>
                <div style="color:var(--neon-red); font-size:0.7rem; font-weight:900;">VS</div>
                <div style="font-weight:bold">${match.awayTeam.shortName || match.awayTeam.name}</div>
            </div>

            <div style="margin-top:20px; background:rgba(0,0,0,0.3); padding:15px; border-radius:8px;">
                <div style="display:flex; justify-content:space-between; font-size:0.8rem; margin-bottom:5px;">
                    <span style="color:var(--neon-green)">PREDICTION: ${analysis.tip}</span>
                    <span style="font-weight:bold">@${analysis.odd}</span>
                </div>
                <div class="prob-bar">
                    <div class="prob-fill" style="width: 0%; box-shadow: 0 0 10px ${analysis.color}; background:${analysis.color}"></div>
                </div>
                <div style="font-size:0.6rem; color:#555; margin-top:8px; text-align:right;">
                    CONFIDENCE SCORE: ${analysis.conf}%
                </div>
            </div>
        `;

        engine.appendChild(card);
        
        // Trigger animation bară de probabilitate
        setTimeout(() => {
            card.querySelector('.prob-fill').style.width = analysis.conf + '%';
        }, 100);
    }

    function simulateDeepAnalysis(h, a, risk) {
        // Logica complexă bazată pe caractere + profil de risc
        const seed = h.length + a.length + new Date().getDate();
        const hash = (seed * 16807) % 2147483647;
        
        let conf = 65 + (hash % 30);
        let odd = 1.30 + (hash % 150) / 100;

        // Ajustare în funcție de profilul de risc
        if(risk === 'safe') {
            conf = 85 + (hash % 12);
            odd = 1.15 + (hash % 40) / 100;
        } else if(risk === 'aggressive') {
            conf = 45 + (hash % 25);
            odd = 2.10 + (hash % 300) / 100;
        }

        const tips = ["Asian Handicap -0.5", "Over 2.25 Goals", "BTTS Yes", "Home To Win & Over 1.5", "Away Clean Sheet: No", "Draw No Bet: Home"];
        
        return {
            tip: tips[hash % tips.length],
            odd: odd.toFixed(2),
            conf: conf,
            color: conf > 80 ? 'var(--neon-green)' : (conf > 60 ? '#ffcc00' : 'var(--neon-red)')
        };
    }
</script>

</body>
</html>
