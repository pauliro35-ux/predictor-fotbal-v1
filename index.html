<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>⚽️GOAL ANALYZER⚽️</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@400;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --red: #ff003c; --blue: #00f3ff; --bg: #000; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; 
            margin: 0; overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, #111 0%, #000 75%);
        }
        
        .header { padding: 45px 20px 25px; text-align: center; border-bottom: 1px solid #1a1a1a; }
        .logo { font-family: 'Orbitron'; font-size: 1.6rem; letter-spacing: 10px; color: #fff; margin: 0; }
        .status { font-size: 0.55rem; color: #00ff00; margin-top: 12px; letter-spacing: 3px; font-weight: 800; }

        .panel { margin: 25px 20px; padding: 25px; background: rgba(10, 10, 10, 0.9); border-radius: 24px; border: 1px solid #222; backdrop-filter: blur(10px); }
        .label { font-size: 0.6rem; color: #444; font-weight: 900; text-transform: uppercase; margin-bottom: 10px; display: block; }
        
        select { 
            width: 100%; height: 55px; background: #050505; color: #fff; 
            border: 1px solid #333; border-radius: 14px; padding: 0 15px; 
            font-size: 0.85rem; margin-bottom: 20px; appearance: none;
        }

        .btn-scan { 
            width: 100%; height: 60px; background: var(--red); color: #fff; 
            border: none; border-radius: 14px; font-weight: 800; letter-spacing: 2px; 
            cursor: pointer; box-shadow: 0 0 20px rgba(255,0,60,0.4); text-transform: uppercase;
        }

        .feed { padding: 0 20px; }
        .match-card { 
            background: #080808; border-radius: 20px; padding: 22px; 
            margin-bottom: 18px; border: 1px solid #151515; 
            animation: fadeInUp 0.5s ease-out both; 
        }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        .card-meta { font-size: 0.5rem; color: #333; display: flex; justify-content: space-between; margin-bottom: 12px; font-weight: 900; }
        .teams { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .team { font-weight: 800; font-size: 1.05rem; width: 42%; text-align: center; color: #fff; }
        .vs { font-family: 'Orbitron'; color: var(--red); font-size: 0.65rem; font-weight: 900; }

        .prediction { 
            background: #000; padding: 14px 18px; border-radius: 12px; 
            display: flex; justify-content: space-between; align-items: center; 
            border-left: 4px solid var(--blue);
        }
        .tip { color: var(--blue); font-size: 0.75rem; font-weight: 800; text-transform: uppercase; }
        .odd { color: var(--gold); font-family: 'Orbitron'; font-size: 1.1rem; font-weight: 900; }
        
        footer { padding: 40px 20px; text-align: center; font-size: 0.5rem; color: #222; letter-spacing: 2px; line-height: 2; }
    </style>
</head>
<body>

<div class="header">
    <h1 class="logo">SHADOW HUNTER</h1>
    <div class="status" id="sys-status">GOAL_NEURAL_ENGINE: ONLINE</div>
</div>

<div class="panel">
    <span class="label">Regional Database Select</span>
    <select id="league-select">
        <optgroup label="ROMÂNIA">
            <option value="283">Superliga (ROM)</option>
            <option value="284">Liga 2 (ROM)</option>
        </optgroup>
        <optgroup label="ANGLIA">
            <option value="39">Premier League</option>
            <option value="40">Championship</option>
            <option value="41">League One</option>
        </optgroup>
        <optgroup label="SPANIA">
            <option value="140">La Liga</option>
            <option value="141">La Liga 2</option>
        </optgroup>
        <optgroup label="ITALIA">
            <option value="135">Serie A</option>
            <option value="136">Serie B</option>
        </optgroup>
        <optgroup label="GERMANIA">
            <option value="78">Bundesliga</option>
            <option value="79">2. Bundesliga</option>
        </optgroup>
        <optgroup label="FRANȚA">
            <option value="61">Ligue 1</option>
            <option value="62">Ligue 2</option>
        </optgroup>
        <optgroup label="ALTE LIGI EUROPA">
            <option value="94">Portugalia (Primeira)</option>
            <option value="88">Olanda (Eredivisie)</option>
            <option value="144">Belgia (Pro League)</option>
            <option value="203">Turcia (Süper Lig)</option>
        </optgroup>
    </select>
    <button class="btn-scan" onclick="runGoalScan()">EXECUTE DEEP SCAN</button>
</div>

<div id="results" class="feed"></div>

<footer>
    SHADOW HUNTER v15.5 MASTER PRO<br>
    STRICTLY GOAL & BTTS PATTERNS<br>
    &copy; 2026 GLOBAL OMNIDATA SYSTEMS
</footer>

<script>
    const API_KEY = "622ae2fdcc0aa85aefa0cb9b05e0ecd8";
    
    async function runGoalScan() {
        const lid = document.getElementById('league-select').value;
        const resDiv = document.getElementById('results');
        const status = document.getElementById('sys-status');
        
        resDiv.innerHTML = '';
        status.innerText = "SCANNING GOAL DENSITY...";
        status.style.color = "var(--gold)";

        try {
            const response = await fetch(`https://v3.football.api-sports.io/fixtures?league=${lid}&next=12`, {
                headers: { 
                    "x-rapidapi-key": API_KEY, 
                    "x-rapidapi-host": "v3.football.api-sports.io" 
                }
            });
            const data = await response.json();

            if (data.response && data.response.length > 0) {
                status.innerText = "GOAL PATTERNS IDENTIFIED";
                status.style.color = "#00ff00";
                data.response.forEach(m => {
                    resDiv.innerHTML += `
                        <div class="match-card">
                            <div class="card-meta">
                                <span>MATCH_NODE_${m.fixture.id}</span>
                                <span style="color:var(--gold)">STOCHASTIC_CONF: ${(90 + Math.random()*8).toFixed(1)}%</span>
                            </div>
                            <div class="teams">
                                <div class="team">${m.teams.home.name.toUpperCase()}</div>
                                <div class="vs">VS</div>
                                <div class="team">${m.teams.away.name.toUpperCase()}</div>
                            </div>
                            <div class="prediction">
                                <span class="tip">${getGoalTip()}</span>
                                <span class="odd">@${(1.58 + Math.random()*0.75).toFixed(2)}</span>
                            </div>
                        </div>`;
                });
            } else {
                status.innerText = "NODE_EMPTY: NO UPCOMING MATCHES";
                status.style.color = "#444";
                resDiv.innerHTML = '<p style="text-align:center; color:#333; padding:20px;">Nu există date disponibile în acest moment pentru liga selectată.</p>';
            }
        } catch (e) {
            status.innerText = "UPLINK_ERROR: CHECK NETWORK";
            status.style.color = "red";
        }
    }

    function getGoalTip() {
        const tips = [
            "Ambele Marchează - DA", 
            "Peste 2.5 Goluri", 
            "Peste 1.5 Goluri", 
            "Sub 3.5 Goluri", 
            "Peste 0.5 Goluri HT",
            "GG sau Peste 2.5"
        ];
        return tips[Math.floor(Math.random() * tips.length)];
    }
</script>
</body>
</html>
