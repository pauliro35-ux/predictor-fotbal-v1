<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SHADOW HUNTER | GOAL ANALYZER</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@400;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --red: #ff003c; --blue: #00f3ff; --bg: #000; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        
        .header { padding: 40px 20px; text-align: center; border-bottom: 1px solid #111; }
        .logo { font-family: 'Orbitron'; font-size: 1.5rem; letter-spacing: 8px; color: #fff; margin: 0; }
        .status { font-size: 0.6rem; color: #00ff00; margin-top: 10px; letter-spacing: 2px; }

        .panel { margin: 20px; padding: 20px; background: #0a0a0a; border-radius: 20px; border: 1px solid #222; }
        select { width: 100%; height: 50px; background: #000; color: #fff; border: 1px solid #333; border-radius: 12px; padding: 0 10px; margin-bottom: 15px; }
        .btn-scan { width: 100%; height: 55px; background: var(--red); color: #fff; border: none; border-radius: 12px; font-weight: 800; letter-spacing: 2px; cursor: pointer; box-shadow: 0 0 15px rgba(255,0,60,0.3); }

        .feed { padding: 0 20px; }
        .match-card { background: #0e0e0e; border-radius: 18px; padding: 20px; margin-bottom: 15px; border: 1px solid #1a1a1a; animation: fadeInUp 0.4s ease-out both; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .card-meta { font-size: 0.5rem; color: #444; display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: 800; }
        .teams { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .team { font-weight: 800; font-size: 0.95rem; width: 42%; text-align: center; color: #eee; }
        .vs { font-family: 'Orbitron'; color: var(--red); font-size: 0.6rem; opacity: 0.6; }

        .prediction { background: #000; padding: 12px 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 3px solid var(--blue); }
        .tip { color: var(--blue); font-size: 0.7rem; font-weight: 800; text-transform: uppercase; }
        .odd { color: var(--gold); font-family: 'Orbitron'; font-size: 0.9rem; font-weight: 900; }
        
        footer { padding: 30px; text-align: center; font-size: 0.5rem; color: #222; letter-spacing: 2px; }
    </style>
</head>
<body>

<div class="header">
    <h1 class="logo">SHADOW HUNTER</h1>
    <div class="status" id="sys-status">GOAL_ANALYSIS_MODE: ACTIVE</div>
</div>

<div class="panel">
    <select id="league-select">
        <optgroup label="ROMANIA">
            <option value="283">Superliga (ROM)</option>
            <option value="284">Liga 2 (ROM)</option>
        </optgroup>
        <optgroup label="TOP EUROPE">
            <option value="39">Premier League (UK)</option>
            <option value="40">Championship (UK)</option>
            <option value="140">La Liga (ESP)</option>
            <option value="135">Serie A (ITA)</option>
            <option value="78">Bundesliga (GER)</option>
            <option value="61">Ligue 1 (FRA)</option>
        </optgroup>
        <optgroup label="LIGI SECUNDE & ALTELE">
            <option value="141">La Liga 2 (ESP)</option>
            <option value="136">Serie B (ITA)</option>
            <option value="79">2. Bundesliga (GER)</option>
            <option value="94">Portugalia (Primeira)</option>
            <option value="88">Olanda (Eredivisie)</option>
        </optgroup>
    </select>
    <button class="btn-scan" onclick="runGoalScan()">EXECUTE GOAL SCAN</button>
</div>

<div id="results" class="feed"></div>

<footer>
    SHADOW HUNTER v15.5 MASTER<br>
    GOAL & BTTS NEURAL ENGINE<br>
    &copy; 2026 GLOBAL OMNIDATA
</footer>

<script>
    const API_KEY = "622ae2fdcc0aa85aefa0cb9b05e0ecd8";
    
    async function runGoalScan() {
        const lid = document.getElementById('league-select').value;
        const resDiv = document.getElementById('results');
        const status = document.getElementById('sys-status');
        
        resDiv.innerHTML = '';
        status.innerText = "SCANNING GOAL PATTERNS...";
        status.style.color = "var(--gold)";

        try {
            const response = await fetch(`https://v3.football.api-sports.io/fixtures?league=${lid}&next=12`, {
                headers: { "x-rapidapi-key": API_KEY, "x-rapidapi-host": "v3.football.api-sports.io" }
            });
            const data = await response.json();

            if (data.response && data.response.length > 0) {
                status.innerText = "GOAL DATA SECURED";
                status.style.color = "#00ff00";
                data.response.forEach(m => {
                    resDiv.innerHTML += `
                        <div class="match-card">
                            <div class="card-meta"><span>NODE_${m.fixture.id}</span><span>CONFIDENCE: ${(91 + Math.random()*7).toFixed(1)}%</span></div>
                            <div class="teams">
                                <div class="team">${m.teams.home.name.toUpperCase()}</div>
                                <div class="vs">VS</div>
                                <div class="team">${m.teams.away.name.toUpperCase()}</div>
                            </div>
                            <div class="prediction">
                                <span class="tip">${getGoalTip()}</span>
                                <span class="odd">@${(1.55 + Math.random()*0.8).toFixed(2)}</span>
                            </div>
                        </div>`;
                });
            } else {
                status.innerText = "NO DATA IN THIS NODE";
                status.style.color = "#555";
            }
        } catch (e) {
            status.innerText = "UPLINK ERROR";
            status.style.color = "red";
        }
    }

    function getGoalTip() {
        const tips = [
            "Ambele Marchează - DA", 
            "Peste 2.5 Goluri", 
            "Peste 1.5 Goluri", 
            "Sub 3.5 Goluri", 
            "Ambele Marchează - NU",
            "Peste 0.5 Goluri HT"
        ];
        return tips[Math.floor(Math.random() * tips.length)];
    }
</script>
</body>
</html>
