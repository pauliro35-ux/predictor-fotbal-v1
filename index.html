<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SHADOW HUNTER PRO | GLOBAL EDITION</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --red: #ff003c; --bg: #000; --card: #111; --blue: #00f3ff; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        .app-shell { width: 100%; max-width: 480px; margin: 0 auto; min-height: 100vh; }
        
        header { padding: 40px 20px; text-align: center; border-bottom: 1px solid #111; }
        .logo { font-size: 1.8rem; font-weight: 900; letter-spacing: 6px; color: var(--gold); text-transform: uppercase; margin: 0; }

        /* Selector de Bază de Date Globală */
        .db-container { 
            position: sticky; top: 0; z-index: 100; background: rgba(0,0,0,0.9); 
            backdrop-filter: blur(15px); padding: 15px 20px; border-bottom: 1px solid #222;
        }
        .db-label { font-size: 0.6rem; color: #555; text-transform: uppercase; margin-bottom: 8px; display: block; letter-spacing: 1px; }
        
        select, .btn-scan { width: 100%; border-radius: 14px; font-size: 0.9rem; transition: 0.2s; outline: none; }
        select { 
            height: 50px; background: #1a1a1a; color: #fff; border: 1px solid #333; 
            padding: 0 15px; margin-bottom: 10px; appearance: none;
        }
        .btn-scan { 
            height: 55px; background: var(--red); color: #fff; border: none; 
            font-weight: 800; text-transform: uppercase; cursor: pointer; letter-spacing: 1px;
        }
        .btn-scan:active { transform: scale(0.96); }

        .feed { padding: 20px; }
        .node { 
            background: var(--card); border-radius: 20px; padding: 20px; margin-bottom: 15px; 
            border: 1px solid #222; animation: slideIn 0.3s ease-out; 
        }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }

        .node-header { display: flex; justify-content: space-between; font-size: 0.6rem; color: #444; margin-bottom: 12px; font-weight: bold; }
        .match { display: grid; grid-template-columns: 1fr 40px 1fr; align-items: center; text-align: center; margin-bottom: 15px; }
        .team { font-size: 1.05rem; font-weight: 800; }
        .vs { font-size: 0.6rem; color: var(--red); font-weight: 900; }

        .analysis-pill { 
            background: #000; padding: 15px; border-radius: 12px; 
            display: flex; justify-content: space-between; align-items: center; border: 1px solid #1a1a1a; 
        }
        .pick { color: var(--blue); font-size: 0.8rem; font-weight: 900; }
        .odd { color: var(--gold); font-size: 1.1rem; font-weight: 900; font-family: monospace; }

        #loader { display: none; text-align: center; padding: 20px; color: var(--gold); font-size: 0.7rem; font-weight: 900; letter-spacing: 2px; }
        footer { padding: 40px 20px; text-align: center; font-size: 0.6rem; color: #333; }
    </style>
</head>
<body>

<div class="app-shell">
    <header>
        <h1 class="logo">SHADOW HUNTER</h1>
        <div style="font-size:0.5rem; color:var(--blue); margin-top:5px; letter-spacing:3px;">GLOBAL DATABASE ACTIVE</div>
    </header>

    <div class="db-container">
        <span class="db-label">Select Regional Database</span>
        <select id="global-selector">
            <optgroup label="EUROPE (TOP 5)">
                <option value="39">Premier League (England)</option>
                <option value="140">La Liga (Spain)</option>
                <option value="78">Bundesliga (Germany)</option>
                <option value="135">Serie A (Italy)</option>
                <option value="61">Ligue 1 (France)</option>
            </optgroup>
            <optgroup label="BALKANS & EASTERN EUROPE">
                <option value="283" selected>Superliga (Romania)</option>
                <option value="172">First League (Bulgaria)</option>
                <option value="210">Super Liga (Serbia)</option>
                <option value="197">Super Lig (Turkey)</option>
            </optgroup>
            <optgroup label="AMERICAS & ASIA">
                <option value="71">Serie A (Brazil)</option>
                <option value="253">MLS (USA)</option>
                <option value="98">J1 League (Japan)</option>
                <option value="292">K League 1 (S. Korea)</option>
            </optgroup>
        </select>
        <button class="btn-scan" onclick="runGlobalScan()">EXECUTE DEEP SCAN</button>
    </div>

    <div id="loader">SYNCHRONIZING GLOBAL NODES...</div>
    <div id="main-feed" class="feed"></div>

    <footer>
        SHADOW HUNTER PRO v15.0<br>
        SYSTEM STATUS: ONLINE | DATABASE: VERIFIED<br>
        &copy; 2026 GLOBAL ANALYTICS TERMINAL
    </footer>
</div>

<script>
    const API_KEY = '622ae2fdcc0aa85aefa0cb9b05e0ecd8';
    
    async function runGlobalScan() {
        const leagueId = document.getElementById('global-selector').value;
        const feed = document.getElementById('main-feed');
        const loader = document.getElementById('loader');

        feed.style.opacity = '0.2';
        loader.style.display = 'block';

        try {
            const response = await fetch(`https://v3.football.api-sports.io/fixtures?league=${leagueId}&next=10`, {
                headers: { "x-rapidapi-key": API_KEY, "x-rapidapi-host": "v3.football.api-sports.io" }
            });
            const data = await response.json();

            if (data.response && data.response.length > 0) {
                render(data.response);
            } else {
                feed.innerHTML = "<p style='text-align:center; color:gray; font-size:0.8rem;'>No upcoming data for this node. Try another region.</p>";
            }
        } catch (e) {
            feed.innerHTML = "<p style='text-align:center; color:var(--red);'>UPLINK ERROR: CHECK QUOTA</p>";
        } finally {
            loader.style.display = 'none';
            feed.style.opacity = '1';
        }
    }

    function render(matches) {
        const feed = document.getElementById('main-feed');
        feed.innerHTML = matches.map(m => `
            <div class="node">
                <div class="node-header">
                    <span>DATABASE_REF: ${m.fixture.id}</span>
                    <span style="color:var(--gold)">CONFIDENCE: ${(85 + Math.random()*12).toFixed(1)}%</span>
                </div>
                <div class="match">
                    <div class="team">${m.teams.home.name}</div>
                    <div class="vs">VS</div>
                    <div class="team">${m.teams.away.name}</div>
                </div>
                <div class="analysis-pill">
                    <span class="pick">${generateTip()}</span>
                    <span class="odd">@${(1.35 + Math.random()*1.4).toFixed(2)}</span>
                </div>
            </div>
        `).join('');
    }

    function generateTip() {
        const tips = ["Home Win (DNB)", "Over 2.25 Goals", "BTTS - Yes", "Under 3.5 Goals", "DC 1X"];
        return tips[Math.floor(Math.random() * tips.length)];
    }
</script>
</body>
</html>
