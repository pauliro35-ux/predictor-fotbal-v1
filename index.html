<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SHADOW HUNTER PRO | Global Analytics</title>
    <style>
        :root { --accent: #d4af37; --red: #ff003c; --bg: #050505; --card: #121212; --blue: #00f3ff; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
        
        .app-container { width: 100%; max-width: 500px; margin: 0 auto; min-height: 100vh; padding: 15px; box-sizing: border-box; }
        
        header { text-align: center; padding: 25px 0; border-bottom: 1px solid #1a1a1a; margin-bottom: 20px; }
        .logo { font-size: 1.5rem; font-weight: 900; letter-spacing: 7px; color: var(--accent); text-transform: uppercase; }
        .version { font-size: 0.5rem; color: #444; margin-top: 5px; letter-spacing: 2px; }

        /* DB Controls */
        .db-panel { background: #0c0c0c; padding: 20px; border-radius: 20px; border: 1px solid #222; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .label { font-size: 0.6rem; color: #666; text-transform: uppercase; letter-spacing: 1.5px; display: block; margin-bottom: 10px; }
        
        select, .btn-scan { 
            width: 100%; padding: 16px; border-radius: 12px; background: #1a1a1a; color: #fff; 
            border: 1px solid #333; font-size: 0.9rem; margin-bottom: 12px; outline: none; appearance: none;
        }
        
        .btn-scan { 
            background: var(--red); border: none; font-weight: 900; text-transform: uppercase; 
            cursor: pointer; letter-spacing: 1px; transition: 0.2s;
        }
