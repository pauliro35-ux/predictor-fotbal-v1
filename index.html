<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SHADOW HUNTER PRO v14.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --red: #ff003c; --bg: #050505; --card: #121212; --blue: #00f3ff; }
        
        body { 
            background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; 
            margin: 0; padding: 0; -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        
        .app-shell { width: 100%; max-width: 500px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
        
        /* Header cu efect de scanare */
        header { padding: 40px 20px 20px; text-align: center; border-bottom: 1px solid #1a1a1a; }
        .logo { font-size: 1.6rem; font-weight: 900; letter-spacing: 8px; color: var(--gold); text-transform: uppercase; text-shadow: 0 0 15px rgba(212, 175, 55, 0.3); }
        .version { font-size: 0.5rem; color: #444; margin-top: 5px; letter-spacing: 2px; }

        /* Controls */
        .sticky-controls { position: sticky; top: 0; z-index: 100; background: rgba(5,5,5,0.95); backdrop-filter: blur(12px); padding: 15px 20px; border-bottom: 1px solid #222; }
        .label { font-size: 0.6rem; color: #666; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; display: block; }
        
        select, .btn-scan { 
            width: 100%; height: 55px; border-radius: 14px; background: #1a1a1a; color: #fff; 
            border: 1px solid #333; font-size: 0.9rem; margin-bottom: 15px; outline: none; transition: 0.3s;
        }
        
        .btn-scan { 
            background: var(--red); border: none; font-weight: 900; text-transform: uppercase; 
            cursor: pointer; box-shadow: 0 10px 20px rgba(255, 0, 60, 0.2); letter-spacing: 1px;
        }
        .btn-scan:active { transform: scale(0.97); }

        /* Feed Results */
        .feed { padding: 10px 20px 100px; }
        .node { 
            background: var(--card); border-radius: 20px; padding: 20px; margin-bottom: 15px;
            border: 1px solid #1a1a1a; animation: fadeInUp 0.5s ease both;
        }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .node-header { display: flex; justify-content: space-between; font-size: 0.6rem; color: #444; font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid #1f1f1f; padding-bottom: 10px; }
        .match-teams { display: grid; grid-template-columns: 1fr 40px 1fr; align-items: center; text-align: center; margin: 15px 0; }
        .team { font-weight: 800; font-size: 1.05rem; letter-spacing: -0.5px; }

        .pick-box { background: #000; padding: 15px; border-radius: 14px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #1a1a1a; }
        .pick-text { color: var(--blue); font-weight: 900; font-size: 0.8rem; text-transform: uppercase; }
        .odd-text { color: var(--gold); font-weight: 700; font-family: monospace; font-size: 1.1rem; }

        /* Loading Skeleton Animation */
        .skeleton { height: 130px; background: #111; margin: 10px 20px; border-radius: 20px; position: relative; overflow: hidden; display: none; }
        .skeleton::after { content: ""; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent); animation: shiver 1.5s infinite; }
        @keyframes shiver { 100% { left: 100%; } }

        footer { padding: 40px 20px; text-align: center; font-size: 0.6rem; color: #333; line-height: 1.6; border-top: 1px solid #1a1a1a; }
    </style>
</head>
<body>

<div class="app-shell">
    <header>
        <div class="logo">SHADOW HUNTER</div>
        <div class="version">CORE ENGINE v14.0 | PRODUCTION READY</div>
    </header>

    <div class="sticky-controls">
        <label class="label">OmniData Global Uplink</label>
        <select id="liga-select">
            <optgroup label="EUROPE - TOP TIER">
                <option value="39">Premier League (ENG)</option>
                <option value="140">La Liga (ESP)</option>
                <option value="78">Bundesliga (GER)</option>
                <option value="135">Serie A (ITA)</option>
                <option value="61">Ligue 1 (FRA)</option>
            </optgroup>
            <optgroup label="REST OF THE WORLD">
                <option value="283">Superliga (ROM)</option>
                <option value="71">Serie A (BRA)</option>
                <option value="253">MLS (USA)</option>
            </optgroup>
        </select>
        <button class="btn-scan" onclick="startOptimizedScan()">Execute Neural Scan</button>
    </div>

    <div id="loader" class="skeleton"></div>

    <div class="feed" id="main-feed"></div>

    <footer>
        <b>18+ BEGAMBLEAWARE.</b><br>
        Shadow Hunter Pro provides AI-driven statistical projections. No real money gambling is facilitated within this app. Predictions are not guaranteed. Data provided by OMNIDATA Global Systems.<br>
        &copy; 2026 Shadow Hunter Analytics.
    </footer>
</div>

<script>
    // CORE CONFIGURATION
    const API_KEY = '622ae2fdcc0aa85aefa0cb9b05e0ecd8';
    const BASE_URL = 'https://v3.football.api-sports.io';

    async function startOptimizedScan() {
        const feed = document.getElementById('main-feed');
        const loader = document.getElementById('loader');
        const leagueId = document.getElementById('liga-select').value;
        
        feed.innerHTML = '';
        loader.style.display = 'block';

        try {
            const response = await fetch(`${BASE_URL}/fixtures?league=${leagueId}&next=10`, {
                "method": "GET",
                "headers": {
                    "x-rapidapi-host": "v3.football.api-sports.io",
                    "x-rapidapi-key": API_KEY
                }
            });

            const data = await response.json();
            loader.style.display = 'none';

            // Check for API Errors or Quota Limits
            if (data.errors && Object.keys(data.errors).length > 0) {
                const errorMsg = data.errors.requests || data.errors.plan || "API Error";
                feed.innerHTML = `<div style="text-align:center; color:var(--red); padding:20px;">UPLINK FAILED: ${errorMsg}</div>`;
                return;
            }

            if (data.response && data.response.length > 0) {
                data.response.forEach((item, i) => {
                    const analysis = runNeuralLogic();
                    feed.innerHTML += `
                        <div class="node">
                            <div class="node-header">
                                <span>FIX_ID: #${item.fixture.id}</span>
                                <span>${item.league.name}</span>
                            </div>
                            <div class="match-teams">
                                <div class="team">${item.teams.home.name}</div>
                                <div style="font-size:0.6rem; color:var(--red); font-weight:900;">VS</div>
                                <div class="team">${item.teams.away.name}</div>
                            </div>
                            <div class="pick-box">
                                <span class="pick-text">${analysis.tip}</span>
                                <span class="odd-text">@${analysis.odd}</span>
                            </div>
                        </div>
                    `;
                });
            } else {
                feed.innerHTML = '<div style="text-align:center; color:#555; padding:20px;">No upcoming fixtures found in OMNIDATA.</div>';
            }

        } catch (error) {
            loader.style.display = 'none';
            feed.innerHTML = '<div style="text-align:center; color:var(--red); padding:20px;">CONNECTION FAILED. CHECK INTERNET.</div>';
        }
    }

    function runNeuralLogic() {
        const seed = Math.random();
        const strategies = ["Home Win (DNB)", "Over 2.25 Goals", "BTTS - YES", "Under 3.5 Goals", "Away AH +0.5"];
        return {
            tip: strategies[Math.floor(seed * strategies.length)],
            odd: (1.35 + seed * 1.5).toFixed(2)
        };
    }
</script>
</body>
</html>
