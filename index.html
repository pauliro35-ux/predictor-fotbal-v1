<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHADOW HUNTER AI | Professional Football Predictor</title>
    <meta name="description" content="Advanced AI-powered football predictions. Analyzing Premier League, La Liga, and Superliga with high accuracy.">
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@400;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --red: #ff003c; --blue: #00f3ff; --bg: #000; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        
        .header { padding: 45px 20px; text-align: center; border-bottom: 1px solid #111; position: relative; }
        .logo { font-family: 'Orbitron'; font-size: 1.6rem; letter-spacing: 8px; margin: 0; background: linear-gradient(to right, #fff, #666); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #sys-status { font-size: 0.55rem; color: #0f0; margin-top: 10px; letter-spacing: 2px; font-weight: 800; }

        .panel { margin: 20px; padding: 25px; background: #080808; border-radius: 20px; border: 1px solid #222; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        select { width: 100%; height: 60px; background: #000; color: #fff; border: 1px solid #333; border-radius: 12px; font-size: 1rem; margin-bottom: 20px; padding: 0 15px; font-family: 'Orbitron'; cursor: pointer; }
        
        .btn-scan { width: 100%; height: 70px; background: var(--red); color: #fff; border: none; border-radius: 12px; font-weight: 900; text-transform: uppercase; cursor: pointer; box-shadow: 0 0 25px rgba(255,0,62,0.4); transition: 0.3s; font-size: 1.1rem; }
        .btn-scan:active { transform: scale(0.98); }

        #results { padding: 0 20px 20px; min-height: 100px; }
        
        .match-card { background: #0a0a0a; border-radius: 18px; padding: 22px; margin-bottom: 20px; border: 1px solid #1a1a1a; border-left: 4px solid var(--blue); animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .teams { display: flex; justify-content: space-between; align-items: center; margin: 15px 0; font-weight: 800; font-size: 1.1rem; }
        .vs { color: var(--red); font-size: 0.75rem; font-family: 'Orbitron'; }
        
        .prediction { background: #050505; padding: 18px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #151515; }
        .tip { color: var(--blue); font-weight: 900; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; }
        .odd { color: var(--gold); font-family: 'Orbitron'; font-weight: 900; font-size: 1.2rem; }

        /* DOWNLOAD SECTION */
        .app-footer { text-align: center; padding: 40px 20px 100px; background: linear-gradient(0deg, #000, #080808); border-top: 1px solid #111; }
        .promo-text { color: #555; font-size: 0.75rem; letter-spacing: 1px; margin-bottom: 20px; text-transform: uppercase; }
        .btn-google-play { display: inline-block; background: #fff; color: #000; padding: 18px 35px; border-radius: 15px; text-decoration: none; font-weight: 900; font-size: 0.9rem; text-transform: uppercase; box-shadow: 0 5px 15px rgba(255,255,255,0.1); transition: 0.3s; }
        .btn-google-play:hover { background: var(--blue); transform: translateY(-3px); }
        .privacy-link { display: block; margin-top: 30px; color: #333; font-size: 0.7rem; text-decoration: none; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="logo">SHADOW HUNTER</h1>
        <div id="sys-status">CORE_V15_READY // AI_ENGINE: ACTIVE</div>
    </div>

    <div class="panel">
        <select id="league-select">
            <option value="RO">SUPERLIGA (ROMANIA)</option>
            <option value="UK">PREMIER LEAGUE (UK)</option>
            <option value="ES">LA LIGA (SPAIN)</option>
            <option value="IT">SERIE A (ITALY)</option>
            <option value="DE">BUNDESLIGA (GERMANY)</option>
        </select>
        <button class="btn-scan" onclick="startScan()">EXECUTE MASTER SCAN</button>
    </div>

    <div id="results">
        </div>

    <div class="app-footer">
        <p class="promo-text">Get Full AI Analysis & Live Alerts</p>
        <a href="https://play.google.com/store/apps/details?id=com.shadowhunter.goalpredictopro" class="btn-google-play">
            Download on Google Play
        </a>
        <a href="privacy.html" class="privacy-link">Privacy Policy</a>
    </div>

    <script>
        function startScan() {
            const res = document.getElementById('results');
            const status = document.getElementById('sys-status');
            const league = document.getElementById('league-select').options[document.getElementById('league-select').selectedIndex].text;
            
            status.innerText = "SCANNING_NODES_FOR_" + league.replace(" ", "_");
            res.innerHTML = "<p style='text-align:center; color:var(--gold); font-family:Orbitron; font-size:0.75rem; margin-top:30px;'>PENETRATING DATABASE...</p>";
            
            setTimeout(() => {
                status.innerText = "DATABASE_SYNCED // " + league;
                res.innerHTML = `
                    <div class="match-card">
                        <div style="font-size:0.6rem; color:#444; margin-bottom:12px; font-family:Orbitron;">STREAM_DATE: ${new Date().toLocaleDateString()}</div>
                        <div class="teams">
                            <span>HOME TEAM</span>
                            <span class="vs">VS</span>
                            <span>AWAY TEAM</span>
                        </div>
                        <div class="prediction">
                            <span class="tip">AI TARGET: OVER 2.5 GOALS</span>
                            <span class="odd">@1.85</span>
                        </div>
                    </div>
                    <p style="text-align:center; font-size:0.65rem; color:#333; font-weight:800;">[ ! ] DOWNLOAD THE APP FOR THE FULL MATCH LIST</p>`;
            }, 1500);
        }
    </script>

</body>
</html>
