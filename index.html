<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHADOW HUNTER v9.0 GLOBAL</title>
    <style>
        :root { 
            --neon-red: #ff003c; 
            --neon-green: #00f3ff; 
            --dark-bg: #050505;
            --card-bg: #111111;
            --accent: #1a1a1a;
        }

        body { 
            background: var(--dark-bg); color: #e0e0e0; 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            margin: 0; padding: 0; display: flex; justify-content: center;
        }

        .container {
            width: 100%; max-width: 500px; min-height: 100vh;
            background: #000; padding: 15px; box-sizing: border-box;
        }

        .header {
            text-align: center; padding: 25px 10px;
            border-bottom: 2px solid var(--neon-red); margin-bottom: 15px;
        }

        .header h1 { margin: 0; font-size: 1.6rem; letter-spacing: 4px; text-shadow: 0 0 10px var(--neon-red); }

        .grid-ui { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 15px; }

        select, button {
            width: 100%; padding: 16px; border-radius: 10px;
            font-size: 0.95rem; border: 1px solid #333; outline: none;
            box-sizing: border-box; background: var(--accent); color: white;
        }

        .btn-main {
            background: var(--neon-red); border: none; font-weight: 900;
            text-transform: uppercase; box-shadow: 0 4px 15px rgba(255, 0, 60, 0.4);
        }

        .btn-ticket {
            background: #0044ff; border: none; font-weight: 700; margin-top: 10px;
            display: none; /* Apare doar după scanare */
        }

        .match-card {
            background: var(--card-bg); border: 1px solid #222;
            border-radius: 14px; padding: 15px; margin-bottom: 12px;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp { from { opacity:0; transform: translateY(5px); } to { opacity:1; } }

        .vs-line { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; }
        .team { font-weight: 700; font-size: 1rem; width: 42%; text-align: center; }
        .vs-badge { color: var(--neon-red); font-weight: 900; font-size: 0.7rem; }

        .prediction-box {
            background: rgba(0,0,0,0.4); padding: 12px;
            border-radius: 10px; border-left: 3px solid var(--neon-green);
        }

        .conf-bar-bg { height: 4px; background: #222; width: 100%; margin-top: 8px; border-radius: 2px; }
        .conf-bar-fill { height: 100%; background: var(--neon-green); width: 0%; transition: width 1s ease-out; }

        .loader { display: none; text-align: center; color: var(--neon-green); padding: 15px; font-family: monospace; font-size: 0.8rem; }
        .status-tag { font-size: 0.6rem; text-align: center; margin-bottom: 10px; font-weight: bold; text-transform: uppercase; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>SHADOW HUNTER</h1>
        <div id="status-display" class="status-tag" style="color: #666;">SYSTEM IDLE</div>
    </div>

    <div class="grid-ui">
        <select id="liga">
            <optgroup label="EUROPA - ELITE">
                <option value="PL">Premier League (UK)</option>
                <option value="PD">La Liga (ESP)</option>
                <option value="BL1">Bundesliga (GER)</option>
                <option value="SA">Serie A (ITA)</option>
                <option value="FL1">Ligue 1 (FRA)</option>
                <option value="DED">Eredivisie (NED)</option>
                <option value="PPL">Primeira Liga (POR)</option>
            </optgroup>
            <optgroup label="COMPETIȚII INTERNAȚIONALE">
                <option value="CL">Champions League</option>
                <option value="EL">Europa League</option>
                <option value="EC">Euro Championship</option>
                <option value="WC">World Cup</option>
            </optgroup>
            <optgroup label="ALTE LIGI (SIMULATION)">
                <option value="BSA">Brazil Serie A</option>
                <option value="MLS">Major League Soccer</option>
                <option value="ROM">Superliga România</option>
            </optgroup>
        </select>
        
        <select id="risk">
            <option value="balanced">STRATEGY: BALANCED</option>
            <option value="aggressive">STRATEGY: HIGH RISK</option>
            <option value="safe">STRATEGY: SAFE</option>
        </select>

        <button class="btn-main" onclick="executeScan()">START GLOBAL SCAN</button>
        <button id="ticketBtn" class="btn-ticket" onclick="copyTicket()">COPY NEURAL TICKET</button>
    </div>

    <div id="loader" class="loader">INTERCEPTING DATA STREAMS...</div>
    <div id="results"></div>
</div>

<script>
    const API_KEY = '4eb3f34ff8c24bdb93897d45b951126d';
    let currentPredictions = [];

    async function executeScan() {
        const results = document.getElementById('results');
        const loader = document.getElementById('loader');
        const status = document.getElementById('status-display');
        const ticketBtn = document.getElementById('ticketBtn');
        const league = document.getElementById('liga').value;

        results.innerHTML = '';
        currentPredictions = [];
        ticketBtn.style.display = 'none';
        loader.style.display = 'block';
        status.innerText = 'CONNECTING TO UPLINK...';
        status.style.color = 'var(--neon-green)';

        try {
            const proxy = "https://corsproxy.io/?";
            const url = `https://api.football-data.org/v4/competitions/${league}/matches?status=SCHEDULED`;
            
            const response = await fetch(proxy + encodeURIComponent(url), { headers: { 'X-Auth-Token': API_KEY } });
            
            if(!response.ok) throw new Error("Offline");

            const data = await response.json();
            loader.style.display = 'none';
            status.innerText = 'LIVE SATELLITE FEED';

            if(!data.matches || data.matches.length === 0) throw new Error("No Matches");

            data.matches.slice(0, 12).forEach((m, i) => {
                setTimeout(() => renderMatch(m.homeTeam.name, m.awayTeam.name, i), i * 150);
            });
            setTimeout(() => { ticketBtn.style.display = 'block'; }, 2000);

        } catch (e) {
            status.innerText = 'NEURAL BYPASS ACTIVE';
            status.style.color = '#ffcc00';
            
            // Simulator pentru orice ligă selectată
            const mocks = getMocks(league);
            setTimeout(() => {
                loader.style.display = 'none';
                mocks.forEach((m, i) => {
                    setTimeout(() => renderMatch(m.h, m.a, i), i * 150);
                });
                setTimeout(() => { ticketBtn.style.display = 'block'; }, 1000);
            }, 1000);
        }
    }

    function renderMatch(h, a, i) {
        const risk = document.getElementById('risk').value;
        const analysis = generateAnalysis(h, a, risk);
        currentPredictions.push({h, a, tip: analysis.tip, odd: analysis.odd});

        const card = document.createElement('div');
        card.className = 'match-card';
        card.innerHTML = `
            <div class="vs-line">
                <div class="team">${h}</div>
                <div class="vs-badge">VS</div>
                <div class="team">${a}</div>
            </div>
            <div class="prediction-box">
                <div style="display:flex; justify-content:space-between; font-size:0.85rem;">
                    <span style="color:var(--neon-green); font-weight:900;">${analysis.tip}</span>
                    <span style="font-weight:bold;">@${analysis.odd}</span>
                </div>
                <div class="conf-bar-bg"><div class="conf-bar-fill" style="width:0%; background:${analysis.color}"></div></div>
            </div>
        `;
        document.getElementById('results').appendChild(card);
        setTimeout(() => card.querySelector('.conf-bar-fill').style.width = analysis.conf + '%', 50);
    }

    function generateAnalysis(h, a, risk) {
        const seed = h.length + a.length + new Date().getHours();
        const rand = ((seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;

        let odd = (1.35 + rand * 1.4).toFixed(2);
