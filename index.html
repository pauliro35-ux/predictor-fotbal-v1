<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHADOW HUNTER V8.5 MOBILE</title>
    <style>
        :root { 
            --neon-red: #ff003c; 
            --neon-green: #00f3ff; 
            --dark-bg: #050505;
            --card-bg: #111111;
            --accent: #1a1a1a;
        }

        body { 
            background: var(--dark-bg); 
            color: #e0e0e0; 
            font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; 
            margin: 0; 
            padding: 0;
            display: flex; 
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            min-height: 100vh;
            background: #000;
            padding: 15px;
            box-sizing: border-box;
        }

        /* Header Cyberpunk */
        .header {
            text-align: center;
            padding: 30px 10px;
            border-bottom: 2px solid var(--neon-red);
            margin-bottom: 20px;
            background: linear-gradient(to bottom, #110000, #000);
        }

        .header h1 {
            margin: 0;
            font-size: 1.8rem;
            letter-spacing: 5px;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-red);
        }

        .status-line {
            font-size: 0.6rem;
            color: var(--neon-green);
            font-family: monospace;
            margin-top: 8px;
            text-transform: uppercase;
        }

        /* Controls */
        .grid-ui {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        select, button {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            font-size: 0.9rem;
            border: 1px solid #333;
            outline: none;
            box-sizing: border-box;
        }

        select {
            background: var(--accent);
            color: white;
            grid-column: span 2;
        }

        .btn-main {
            grid-column: span 2;
            background: var(--neon-red);
            color: white;
            font-weight: 900;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 0, 60, 0.4);
        }

        .risk-sel { grid-column: span 2; background: #0a0a0a; border: 1px dashed var(--neon-green); }

        /* Match Nodes */
        .match-card {
            background: var(--card-bg);
            border: 1px solid #222;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            position: relative;
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: translateY(0); } }

        .vs-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0;
        }

        .team { font-weight: 800; font-size: 1.1rem; width: 40%; }
        .vs-badge { color: var(--neon-red); font-size: 0.7rem; font-weight: 900; }

        .prediction-box {
            background: rgba(0,0,0,0.5);
            padding: 12px;
            border-radius: 10px;
            border-left: 3px solid var(--neon-green);
        }

        .conf-bar-bg {
            height: 4px;
            background: #222;
            width: 100%;
            margin-top: 10px;
            border-radius: 2px;
        }

        .conf-bar-fill {
            height: 100%;
            background: var(--neon-green);
            width: 0%;
            transition: width 1.5s ease-in-out;
            box-shadow: 0 0 8px var(--neon-green);
        }

        .loader {
            display: none;
            text-align: center;
            color: var(--neon-green);
            padding: 20px;
            font-family: monospace;
            font-size: 0.8rem;
        }

        .sim-mode-tag {
            color: #ffcc00;
            font-size: 0.6rem;
            text-align: center;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>SHADOW HUNTER</h1>
        <div class="status-line">Uplink: <span id="conn-status">Waiting</span> | Latency: 22ms</div>
    </div>

    <div class="grid-ui">
        <select id="liga">
            <option value="PL">Premier League (ENG)</option>
            <option value="PD">La Liga (ESP)</option>
            <option value="BL1">Bundesliga (GER)</option>
            <option value="SA">Serie A (ITA)</option>
            <option value="CL">Champions League</option>
        </select>
        
        <select id="risk" class="risk-sel">
            <option value="safe">STRATEGY: CONSERVATIVE</option>
            <option value="balanced" selected>STRATEGY: BALANCED</option>
            <option value="aggressive">STRATEGY: HIGH RISK</option>
        </select>

        <button class="btn-main" onclick="executeScan()">EXECUTE NEURAL SCAN</button>
    </div>

    <div id="loader" class="loader">SCANNING SATELLITE FEEDS...</div>
    <div id="sim-notice"></div>
    <div id="results"></div>
</div>

<script>
    const API_KEY = '4eb3f34ff8c24bdb93897d45b951126d';

    async function executeScan() {
        const results = document.getElementById('results');
        const loader = document.getElementById('loader');
        const simNotice = document.getElementById('sim-notice');
        const league = document.getElementById('liga').value;
        const risk = document.getElementById('risk').value;

        results.innerHTML = '';
        simNotice.innerHTML = '';
        loader.style.display = 'block';
        document.getElementById('conn-status').innerText = 'Syncing...';

        try {
            const proxy = "https://corsproxy.io/?";
            const url = `https://api.football-data.org/v4/competitions/${league}/matches?status=SCHEDULED`;
            const response = await fetch(proxy + encodeURIComponent(url), { 
                headers: { 'X-Auth-Token': API_KEY } 
            });

            if(!response.ok) throw new Error('API_FAIL');

            const data = await response.json();
            loader.style.display = 'none';
            document.getElementById('conn-status').innerText = 'Live Feed';

            if(!data.matches || data.matches.length === 0) {
                simNotice.innerHTML = '<div class="sim-mode-tag">NO LIVE DATA - TRY ANOTHER LEAGUE</div>';
                return;
            }

            data.matches.slice(0, 10).forEach((m, i) => {
                setTimeout(() => renderMatch(m.homeTeam.name, m.awayTeam.name, risk, m.id), i * 200);
            });

        } catch (e) {
            console.log("Switching to Neural Simulation...");
            document.getElementById('conn-status').innerText = 'Simulated';
            simNotice.innerHTML = '<div class="sim-mode-tag">--- NEURAL SIMULATION ACTIVE (BYPASS MODE) ---</div>';
            
            const mockData = [
                {h: "Arsenal", a: "Man City"}, {h: "Real Madrid", a: "Girona"},
                {h: "Bayern", a: "Bayer Leverkusen"}, {h: "AC Milan", a: "Napoli"}
            ];

            setTimeout(() => {
                loader.style.display = 'none';
                mockData.forEach((m, i) => {
                    setTimeout(() => renderMatch(m.h, m.a, risk, 999+i), i * 200);
                });
            }, 1000);
        }
    }

    function renderMatch(h, a, risk, id) {
        const container = document.getElementById('results');
        const analysis = calcAnalysis(h, a, risk);
        
        const card = document.createElement('div');
        card.className = 'match-card';
        card.innerHTML = `
            <div style="font-size:0.6rem; color:#444">EVENT_NODE_${id}</div>
            <div class="vs-line">
                <div class="team" style="text-align:right">${h}</div>
                <div class="vs-badge">VS</div>
                <div class="team" style="text-align:left">${a}</div>
            </div>
            <div class="prediction-box">
                <div style="display:flex; justify-content:space-between; font-size:0.8rem">
                    <span style="color:var(--neon-green); font-weight:bold">${analysis.tip}</span>
                    <span style="color:#fff">@${analysis.odd}</span>
                </div>
                <div class="conf-bar-bg">
                    <div class="conf-bar-fill" style="width:0%; background:${analysis.color}"></div>
                </div>
                <div style="font-size:0.55rem; color:#666; margin-top:5px">CONFIDENCE: ${analysis.conf}%</div>
            </div>
        `;
        container.appendChild(card);
        setTimeout(() => card.querySelector('.conf-bar-fill').style.width = analysis.conf + '%', 100);
    }

    function calcAnalysis(h, a, risk) {
        const seed = h.length + a.length + new Date().getDate();
        const pseudo = (seed * 9301 + 49297) %
