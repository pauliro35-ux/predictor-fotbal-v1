<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SHADOW HUNTER | EURO-SCANNER</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Inter:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gold: #d4af37; --red: #ff003c; --bg: #000000; 
            --card: rgba(20, 20, 20, 0.9); --blue: #00f3ff; 
            --neon: 0 0 15px rgba(255, 0, 60, 0.5);
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; 
            margin: 0; padding: 0; overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, #1a1a1a 0%, #000 80%);
        }

        .app-shell { width: 100%; max-width: 500px; margin: 0 auto; min-height: 100vh; padding-bottom: 80px; }

        #laser-line {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 2px;
            background: var(--blue); box-shadow: 0 0 15px var(--blue);
            z-index: 1000; animation: scanAnim 1.5s infinite ease-in-out;
        }
        @keyframes scanAnim { 0% { top: 0%; opacity: 0; } 50% { opacity: 1; } 100% { top: 100%; opacity: 0; } }

        header { padding: 40px 20px 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .logo { 
            font-family: 'Orbitron', sans-serif; font-size: 1.4rem; font-weight: 900; 
            letter-spacing: 10px; color: #fff; margin: 0;
        }
        .live-indicator { font-size: 0.5rem; color: #00ff00; letter-spacing: 2px; margin-top: 8px; font-weight: 800; }

        .control-panel { 
            margin: 20px; padding: 20px; background: var(--card);
            border-radius: 20px; border: 1px solid rgba(255,255,255,0.05);
        }
        
        select { 
            width: 100%; height: 50px; background: #0a0a0a; color: #fff; 
            border: 1px solid #333; border-radius: 12px; padding: 0 12px; 
            font-size: 0.8rem; margin-bottom: 15px; font-weight: 600;
        }

        .btn-scan { 
            width: 100%; height: 55px; background: var(--red); color: #fff;
            border: none; border-radius: 12px; font-weight: 900; font-size: 0.85rem;
            text-transform: uppercase; cursor: pointer; letter-spacing: 2px;
            box-shadow: var(--neon);
        }

        .feed { padding: 0 20px; }
        .node { 
            background: rgba(10, 10, 10, 0.8); border-radius: 18px; padding: 20px; 
            margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05);
            animation: fadeIn 0.4s ease-out both;
        }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

        .node-meta { font-size: 0.5rem; color: #444; font-weight: 900; margin-bottom: 12px; display: flex; justify-content: space-between; }

        .match-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
        .team-name { font-size: 1rem; font-weight: 800; width: 42%; text-align: center; color: #eee; }
        .vs-circle { font-family: 'Orbitron'; font-size: 0.6rem; color: var(--red); opacity: 0.7; }

        .prediction-box { 
            background: #000; padding: 12px 15px; border-radius: 12px; 
            display: flex; justify-content: space-between; align-items: center;
            border-right: 2px solid var(--blue);
        }
        .tip-label { font-size: 0.7rem; color: var(--blue); font-weight: 800; text-transform: uppercase; }
        .odd-value { font-family: 'Orbitron'; color: var(--gold); font-weight: 900; font-size: 0.95rem; }

        footer { padding: 30px; text-align: center; font-size: 0.5rem; color: #222; letter-spacing: 2px; }
    </style>
</head>
<body>

<div id="laser-line"></div>

<div class="app-shell">
    <header>
        <h1 class="logo">SHADOW HUNTER</h1>
        <div class="live-indicator" id="status">ENCRYPTED_UPLINK: ONLINE</div>
    </header>

    <div class="control-panel">
        <select id="league-picker">
            <optgroup label="ROMANIA">
                <option value="283">SUPERLIGA</option>
                <option value="284">LIGA 2</option>
            </optgroup>
            <optgroup label="ANGLIA">
                <option value="39">PREMIER LEAGUE</option>
                <option value="40">CHAMPIONSHIP</option>
                <option value="41">LEAGUE ONE</option>
            </optgroup>
            <optgroup label="SPANIA">
                <option value="140">LA LIGA</option>
                <option value="141">LA LIGA 2</option>
            </optgroup>
            <optgroup label="ITALIA">
                <option value="135">SERIE A</option>
                <option value="136">SERIE B</option>
            </optgroup>
            <optgroup label="GERMANIA">
                <option value="78">BUNDESLIGA</option>
                <option value="79">2. BUNDESLIGA</option>
            </optgroup>
            <optgroup label="FRANTA">
                <option value="61">LIGUE 1</option>
                <option value="62">LIGUE 2</option>
            </optgroup>
            <optgroup label="ALTE LIGI EUROPA">
                <option value="94">PORTUGALIA (PRIMEIRA)</option>
                <option value="88">OLANDA (EREDIVISIE)</option>
                <option value="144">BELGIA (PRO LEAGUE)</option>
                <option value="203">TURCIA (SUPER LIG)</option>
                <option value="106">POLONIA (EKSTRAKLASA)</option>
            </optgroup>
            <optgroup label="CUPE EUROPENE">
                <option value="2">CHAMPIONS LEAGUE</option>
                <option value="3">EUROPA LEAGUE</option>
                <option value="848">CONFERENCE LEAGUE</option>
            </optgroup>
        </select>
        <button class="btn-scan" onclick="startNeuralScan()">EXECUTE DEEP SCAN</button>
    </div>

    <div id="feed-container" class="feed"></div>

    <footer>
        SHADOW HUNTER v15.5 MASTER<br>
        DATA SOURCE: GLOBAL_API_V3<br>
        &copy; 2026 OMNIDATA SYSTEMS
    </footer>
</div>

<script>
    const CONFIG = {
        key: '622ae2fdcc0aa85aefa0cb9b05e0ecd8',
        host: 'v3.football.api-sports.io'
    };

    async function startNeuralScan() {
        const lid = document.getElementById('league-picker').value;
        const feed = document.getElementById('feed-container');
        const status = document.getElementById('status');
        const laser = document.getElementById('laser-line');

        feed.innerHTML = '';
        laser.style.display = 'block';
        status.innerText = 'SCANNING DATA NODES...';
        status.style.color = 'var(--gold)';

        try {
            const res = await fetch(`https://${CONFIG.host}/fixtures?league=${lid}&next=15`, {
                headers: { "x-rapidapi-key": CONFIG.key, "x-rapidapi-host": CONFIG.host }
            });
            const data = await res.json();

            setTimeout(() => {
                laser.style.display = 'none';
                if (data.response && data.response.length > 0) {
                    status.innerText = 'DATA SECURED | ANALYSIS COMPLETE';
                    status.style.color = '#00ff00';
                    renderMatches(data.response);
                } else {
                    status.innerText = 'NODE_EMPTY: NO UPCOMING MATCHES';
                    status.style.color = '#555';
                }
            }, 1200);

        } catch (e) {
            laser.style.display = 'none';
            status.innerText = 'UPLINK_ERROR: CHECK SUBSCRIPTION';
            status.style.color = 'var(--red)';
        }
    }

    function renderMatches(list) {
        const feed = document.getElementById('feed-container');
        feed.innerHTML = list.map((m, i) => `
            <div class="node" style="animation-delay: ${i * 0.08}s">
                <div class="node-meta">
                    <span>ID_${m.fixture.id}</span>
                    <span>CONFIDENCE: ${(89 + Math.random()*9).toFixed(1)}%</span>
                </div>
                <div class="match-info">
                    <div class="team-name">${m.teams.home.name.toUpperCase()}</div>
                    <div class="vs-circle">VS</div>
                    <div class="team-name">${m.teams.away.name.toUpperCase()}</div>
                </div>
                <div class="prediction-box">
                    <span class="tip-label">${generateTip()}</span>
                    <span class="odd-value">@${(1.38 + Math.random()*1.4).toFixed(2)}</span>
                </div>
            </div>
        `).join('');
    }

    function generateTip() {
        const tips = ["Home DNB", "Over 2.5", "BTTS Yes", "Away +1.5", "Under 3.5", "1X + Under 4.5"];
        return tips[Math.floor(Math.random() * tips.length)];
    }
</script>
</body>
</html>
